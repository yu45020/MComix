[project]
name = "mcomix"
dynamic = ["version"]
description = "GTK comic book and manga viewer with GPU neural upscaling (a hard fork of MComix)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7"
license = {file = "COPYING"}
authors = [{name = "Pontus Ekberg"}]
maintainers = [{name = "yu45020"}]
keywords = ["comix", "comics", "manga", "images", "reader", "image viewer", "cbr", "cbz",
            "webp", "avif", "upscaling", "super-resolution"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Viewers"
]
dependencies = [
  "PyGObject>=3.36.0",
  "pycairo>=1.16.0",
  "Pillow>=6.0.0",
]

[project.optional-dependencies]
fileformats = [
  "chardet",
  "PyMuPDF>=1.19.2"
]
# Neural upscaling of small pages
upscale = [
  "numpy",
  # Includes DirectML; windowsml adds faster Windows ML providers (e.g.
  # TensorRT-RTX). Pinned: both packages are young.
  "onnxruntime-windowsml==1.30.0.202609102321; os_name == 'nt'",
  "windowsml==2.4.89; os_name == 'nt'"
]
dev = [
  # For running tests
  "pytest",
  # For building Windows package
  "pyinstaller; os_name == 'nt'",
  # For creating source package
  "build",
  # For updating virtual environment
  "pip-review",
  # For language server/IDE
  "python-lsp-server[flake8]",
  "pylsp-mypy",
  "pyls-isort",
  "python-lsp-black",
  # For mypy
  "types-Pillow",
  "pygobject-stubs"
]

[project.urls]
Homepage = "https://github.com/yu45020/mcomix"
Documentation = "https://github.com/yu45020/mcomix/tree/main/docs/user"
Repository = "https://github.com/yu45020/mcomix"
Issues = "https://github.com/yu45020/mcomix/issues"
Upstream = "https://sourceforge.net/projects/mcomix/"

[project.scripts]
mcomix = "mcomix.__main__:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcomix*"]

[tool.setuptools.dynamic]
version = {attr = "mcomix.constants.VERSION"}

[tool.mypy]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
